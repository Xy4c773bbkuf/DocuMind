services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: document_insight
      POSTGRES_USER: document_user
      POSTGRES_PASSWORD: document_password
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U document_user -d document_insight"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    ports: ["8000:8000"]
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://document_user:document_password@db:5432/document_insight
      JWT_SECRET: replace-with-a-long-random-secret
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - "./backend:/app"
      - "document_storage:/app/storage"
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [api]

volumes:
  postgres_data:
  document_storage:
